<script>
        const socket = io();
        let currentRoomID = null;
        let mySlotID = "[01]";
        let isImWolf = false;
        let canVoteNow = false;

        function findMatch() {
            document.getElementById('btnFindMatch').style.display = 'none';
            socket.emit('find_match');
        }

        // 1. Đồng bộ khởi tạo bàn đấu từ Server
        socket.on('match_started', (data) => {
            currentRoomID = data.roomID;
            isImWolf = data.isWolf;
            document.getElementById('roomInfo').innerText = `Phòng: ${data.roomID} | Ô của bạn: ${mySlotID}`;
            document.getElementById('roleCard').style.display = 'block';

            // Xử lý bảo mật hiển thị kênh chat Sói
            const wolfChatSection = document.getElementById('wolfChatSection');
            if (isImWolf) {
                wolfChatSection.style.display = 'flex'; // CHỈ SÓI MỚI NHÌN THẤY VÀ DÙNG KÊNH CHAT NÀY
                document.getElementById('roleTitle').innerText = "Ma Sói (Phe Hung Ác)";
                document.getElementById('roleTitle').style.color = "#ef4444";
            } else {
                wolfChatSection.style.display = 'none'; // Người chơi khác bị giấu hoàn toàn khỏi DOM
                document.getElementById('roleTitle').innerText = "Dân Làng / Chức Năng";
                document.getElementById('roleTitle').style.color = "#22c55e";
            }
            renderPlayers(data.players);
        });

        // 2. Render real-time trạng thái sống/chết của 12 ô định danh
        function renderPlayers(players) {
            const listContainer = document.getElementById('playersList');
            listContainer.innerHTML = '';
            players.forEach(p => {
                const card = document.createElement('div');
                card.className = `player-card ${p.isAlive ? 'alive' : 'dead'} ${p.isYou ? 'is-you' : ''} ${canVoteNow && p.isAlive && !p.isYou ? 'voting-active' : ''}`;
                
                // Nếu đang trong phase vote, click vào thẻ người chơi khác để gửi lệnh vote lên server
                if (canVoteNow && p.isAlive && !p.isYou) {
                    card.onclick = () => submitVote(p.slotID);
                }

                card.innerHTML = `
                    <div class="player-row">
                        <span>${p.slotID} ${p.isYou ? '(Bạn)' : 'Bot AI'}</span>
                        <span>${p.isAlive ? 'Còn Sống' : 'Tử Thương 💀'}</span>
                    </div>
                    <div class="player-details">Hạng: ${p.rank} | Giới tính: ${p.gender}</div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 3. Xử lý đồng bộ chuyển Phase và đóng/mở quyền Chat thực tế
        socket.on('phase_change', (data) => {
            document.getElementById('phaseTitle').innerText = data.phase;
            document.getElementById('timerDisplay').innerText = data.time;
            
            // Đóng quyền vote mặc định trừ khi được lệnh của server công bố
            canVoteNow = false;
            renderPlayers(data.players);

            // Mở cổng nhập chat công khai nếu đến đúng lượt nói của người chơi chính [01]
            const chatInput = document.getElementById('chatInput');
            const btnSend = document.getElementById('btnSend');
            if (data.phase.includes("Phát biểu 15s: [01]")) {
                chatInput.disabled = false;
                btnSend.disabled = false;
                chatInput.placeholder = "Nhập nội dung biện luận lập luận ngay...";
                chatInput.focus();
            } else {
                chatInput.disabled = true;
                btnSend.disabled = true;
                chatInput.placeholder = "Chờ đến lượt biện luận...";
            }
        });

        // 4. Cập nhật đồng hồ đếm ngược
        socket.on('update_timer', (data) => {
            document.getElementById('timerDisplay').innerText = data.time;
        });

        // 5. Lắng nghe thông báo kích hoạt biểu quyết của server
        socket.on('enable_voting', (data) => {
            canVoteNow = true;
            appendSystemMessage("HỆ THỐNG", "Vòng bỏ phiếu đã mở! Hãy click chọn một ô người chơi ở cột trái để dồn phiếu treo cổ.");
            renderPlayers(data.players);
        });

        // 6. Xử lý nhận tin nhắn các kênh Chat công khai và ẩn danh
        socket.on('bot_chat', (data) => {
            const senderName = data.slot === '' ? '[Hệ Thống]' : `Ô ${data.slot}`;
            appendSystemMessage(senderName, data.message);
        });

        socket.on('receive_message', (data) => {
            appendSystemMessage(data.sender, data.message);
        });

        socket.on('receive_wolf_message', (data) => {
            // Chỉ nhận và hiển thị nếu client hiện tại thuộc băng đảng Sói
            if (isImWolf) {
                const box = document.getElementById('wolfMessages');
                const msg = document.createElement('div');
                msg.className = 'wolf-msg-item';
                msg.innerHTML = `<span>${data.sender}:</span> ${data.message}`;
                box.appendChild(msg);
                box.scrollTop = box.scrollHeight;
            }
        });

        socket.on('vote_recorded', (data) => {
            appendSystemMessage("BỎ PHIẾU", `Người chơi ${data.voter} đã bỏ phiếu phạt nhắm vào ô ${data.target}`);
        });

        socket.on('player_died', (data) => {
            appendSystemMessage("TỬ THƯƠNG", `Người chơi ô định danh ${data.slotID} ${data.reason}.`);
        });

        socket.on('game_over', (data) => {
            appendSystemMessage("KẾT THÚC", `Trận đấu khép lại! Chiến thắng chung cuộc thuộc về: ${data.winner}`);
            alert(`Trận đấu kết thúc! ${data.winner} dành chiến thắng.`);
        });

        // --- HÀM GỬI DỮ LIỆU LÊN SERVER ---
        function appendSystemMessage(sender, text) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = 'message-item';
            msg.innerHTML = `<span>[${sender}]:</span> ${text}`;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        // Gửi tin nhắn biện luận công khai ban ngày
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendPublicMessage();
        });
        document.getElementById('btnSend').onclick = sendPublicMessage;

        function sendPublicMessage() {
            const input = document.getElementById('chatInput');
            const txt = input.value.trim();
            if (!txt || !currentRoomID) return;
            appendSystemMessage("Bạn (01)", txt);
            socket.emit('player_chat', { roomID: currentRoomID, message: txt });
            input.value = '';
        }

        // Gửi lệnh chat riêng ẩn danh ban đêm của Sói
        function sendWolfMessage() {
            const input = document.getElementById('wolfInput');
            const txt = input.value.trim();
            if (!txt || !currentRoomID || !isImWolf) return;
            
            const box = document.getElementById('wolfMessages');
            const msg = document.createElement('div');
            msg.className = 'wolf-msg-item';
            msg.innerHTML = `<span>[Bạn (Sói)]:</span> ${txt}`;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;

            socket.emit('wolf_chat', { roomID: currentRoomID, message: txt });
            input.value = '';
        }

        // Gửi lệnh bỏ phiếu biểu quyết treo cổ lên server
        function submitVote(targetSlotID) {
            if (!canVoteNow) return;
            socket.emit('submit_vote', { roomID: currentRoomID, voter: '[01]', target: targetSlotID });
            canVoteNow = false; // Khóa chức năng chọn sau khi dồn phiếu xong
            appendSystemMessage("HỆ THỐNG", `Bạn đã chốt bỏ phiếu treo cổ ô: ${targetSlotID}`);
        }
    </script>
